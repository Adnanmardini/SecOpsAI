services:

  api:
    build: ./api
    container_name: threat-api
    ports:
      - "8000:8000"

  alert-pipeline:
    build: ./alert-pipeline
    container_name: alert-pipeline
    depends_on:
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"

  redis:
    image: redis:7

  prometheus:
    image: prom/prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
