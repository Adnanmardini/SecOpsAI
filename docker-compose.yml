services:
  api:
    build: ./api
    container_name: threat-api
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  
  alert-pipeline:
    build: ./alert-pipeline
    container_name: alert-pipeline
    depends_on:
      - redis
      - kafka
  
  postgres:
    image: postgres:16
    container_name: secopsai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secopsai
    ports:
      - "5433:5432"
  
  redis:
    image: redis:7
    container_name: secopsai-redis
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: secopsai-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
  
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: secopsai-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  
  prometheus:
    image: prom/prometheus
    container_name: secopsai-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  
  grafana:
    image: grafana/grafana
    container_name: secopsai-grafana
