services:
  api:
    build: ./api
    container_name: threat-api
    ports:
      - "8000:8000"
    volumes:
      - ./ml-engine/models:/app/ml-engine/models:ro
    environment:
      - MODEL_PATH=ml-engine/models/xgboost_hardened.json
      - SCALER_PATH=ml-engine/models/scaler.joblib
      - ENCODER_PATH=ml-engine/models/label_encoder.joblib
    networks:
      - secopsai-network

  alert_pipeline:
    build: ./alert_pipeline
    container_name: alert_pipeline
    restart: unless-stopped
    depends_on:
      - redis
    networks:
      - secopsai-network

  postgres:
    image: postgres:16
    container_name: secopsai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secopsai
    ports:
      - "5433:5432"
    restart: unless-stopped
    networks:
      - secopsai-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data-pipeline/sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7
    networks:
      - secopsai-network

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    networks:
      - secopsai-network
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    networks:
      - secopsai-network
    volumes:
      - grafana_data:/var/lib/grafana

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: on-failure
    ports:
      - "9092:9092"
    networks:
      - secopsai-network
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: 5000
      KAFKA_BROKER_SESSION_TIMEOUT_MS: 18000
      KAFKA_CONTROLLER_QUORUM_REQUEST_TIMEOUT_MS: 60000
      KAFKA_CONTROLLER_QUORUM_ELECTION_TIMEOUT_MS: 10000
      KAFKA_REQUEST_TIMEOUT_MS: 60000
      KAFKA_CONNECTIONS_MAX_IDLE_MS: 540000

networks:
  secopsai-network:
    driver: bridge

volumes:
  grafana_data:
  postgres_data:
